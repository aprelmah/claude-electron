<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>POWER-AGENT · Bitácora</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #171a22;
      --line: #2a3140;
      --text: #e8ebf3;
      --muted: #a2acbf;
      --accent: #79a8ff;
      --ok: #4cc38a;
      --err: #ff6b78;
    }

    body.light {
      --bg: #f4f6fb;
      --panel: #ffffff;
      --line: #d7dde9;
      --text: #1f2533;
      --muted: #59647a;
      --accent: #2f6fed;
      --ok: #2a8f61;
      --err: #c83e4d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .toolbar h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .toolbar-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    button:hover { border-color: var(--accent); color: var(--accent); }

    .filters {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      min-height: 92px;
    }

    .filter-left {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .filter-left label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.45px;
    }

    #filter-actions {
      width: 100%;
      min-height: 84px;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px;
      font-size: 12px;
    }

    .filter-right {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      color: var(--muted);
      overflow: hidden;
    }

    #log-path {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .table {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 10px 14px 14px;
      gap: 6px;
    }

    .head,
    .row {
      display: grid;
      grid-template-columns: 146px 116px 190px 1fr 70px;
      gap: 10px;
      align-items: center;
    }

    .head {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.45px;
      color: var(--muted);
      padding: 0 8px;
    }

    #rows-viewport {
      flex: 1;
      min-height: 0;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: color-mix(in srgb, var(--panel) 90%, transparent);
    }

    .row {
      min-height: 34px;
      border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
      padding: 0 8px;
      font-size: 12px;
    }

    .row:last-child { border-bottom: none; }

    .mono {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 11.5px;
    }

    .cell-detail {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    .ok-true { color: var(--ok); font-weight: 700; }
    .ok-false { color: var(--err); font-weight: 700; }

    .empty {
      padding: 18px;
      color: var(--muted);
      font-size: 12px;
    }

    .status {
      padding: 7px 14px 9px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      min-height: 34px;
      background: var(--panel);
    }

    .status.err { color: var(--err); }
    .status.ok { color: var(--ok); }

    @media (max-width: 940px) {
      .filters { grid-template-columns: 1fr; }
      .head,
      .row { grid-template-columns: 130px 96px 150px 1fr 58px; }
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <h1>Bitácora semántica</h1>
    <div class="toolbar-actions">
      <button id="btn-reload" type="button">Recargar</button>
      <button id="btn-export" type="button">Exportar CSV</button>
    </div>
  </header>

  <section class="filters">
    <div class="filter-left">
      <label for="filter-actions">Filtrar por acción (multiselección)</label>
      <select id="filter-actions" multiple></select>
      <button id="btn-clear-filters" type="button">Mostrar todas</button>
    </div>
    <div class="filter-right">
      <div class="meta">
        <div id="summary">Cargando...</div>
        <div id="log-path">—</div>
      </div>
    </div>
  </section>

  <section class="table">
    <div class="head">
      <div>Hora</div>
      <div>Sesión</div>
      <div>Acción</div>
      <div>Detalle</div>
      <div>OK</div>
    </div>
    <div id="rows-viewport">
      <div id="rows-spacer-top"></div>
      <div id="rows-container"></div>
      <div id="rows-spacer-bottom"></div>
    </div>
  </section>

  <footer id="status" class="status"></footer>

  <script src="bitacora-window-renderer.js"></script>
</body>
</html>
