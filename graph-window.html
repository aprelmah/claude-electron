<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' blob: data:">
  <title>POWER-AGENT — Grafo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #1a1a1f; overflow: hidden; }
    #titlebar {
      position: fixed; top: 0; left: 0; right: 0; min-height: 38px;
      background: #24242b; border-bottom: 1px solid #3a3a48;
      display: flex; align-items: center;
      padding: 4px 8px 4px 82px; gap: 8px; z-index: 10; -webkit-app-region: drag;
    }
    #titlebar .app-title-bolt {
      width: 12px; height: 12px; fill: #facc15;
      filter: drop-shadow(0 0 2px rgba(250, 204, 21, 0.55));
    }
    #titlebar .app-title {
      font-size: 10px; font-weight: 600; color: #9090a8;
      letter-spacing: 0.6px; white-space: nowrap;
      display: inline-flex; align-items: center; gap: 5px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #cwd-label {
      font-size: 11px; color: rgba(255,255,255,0.4);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #controls {
      position: fixed; top: 38px; left: 0; right: 0;
      background: #1a1a1f;
      display: flex; flex-direction: column; gap: 4px;
      padding: 6px 12px; z-index: 9;
      border-bottom: 1px solid #3a3a48;
    }
    .graph-mode-row { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
    .graph-mode-btn {
      font-size: 10px; font-family: system-ui, sans-serif;
      padding: 2px 9px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: transparent; color: rgba(255,255,255,0.3); cursor: pointer; transition: all 0.15s; transform-origin: center;
    }
    .graph-mode-btn:hover { opacity: 0.9; transform: scale(1.08); }
    .graph-mode-btn.active {
      border-color: rgba(148,163,184,0.7); color: rgba(148,163,184,1);
      background: rgba(148,163,184,0.1);
    }
    .btn-graph-forces {
      font-size: 10px; font-family: system-ui, sans-serif;
      padding: 2px 7px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: transparent; color: rgba(255,255,255,0.3); cursor: pointer; transition: all 0.15s; transform-origin: center;
    }
    .btn-graph-forces:hover { opacity: 0.9; transform: scale(1.08); }
    .btn-graph-forces.active {
      border-color: rgba(167,139,250,0.6); color: rgba(167,139,250,1);
      background: rgba(167,139,250,0.08);
    }
    .btn-graph-hot {
      font-size: 10px; font-family: system-ui, sans-serif;
      padding: 2px 7px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: transparent; color: rgba(255,255,255,0.3); cursor: pointer; transition: all 0.15s; transform-origin: center;
    }
    .btn-graph-hot:hover { opacity: 0.9; transform: scale(1.08); }
    .btn-graph-hot.active {
      border-color: rgba(34,197,94,0.65); color: rgba(34,197,94,1);
      background: rgba(34,197,94,0.1);
    }
    .btn-graph-pause {
      font-size: 10px; font-family: system-ui, sans-serif;
      padding: 2px 7px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: transparent; color: rgba(255,255,255,0.3); cursor: pointer; transition: all 0.15s; transform-origin: center;
    }
    .btn-graph-pause:hover { opacity: 0.9; transform: scale(1.08); }
    .btn-graph-pause.active {
      border-color: rgba(251,191,36,0.7); color: rgba(251,191,36,1);
      background: rgba(251,191,36,0.12);
    }
    .graph-speed-wrap {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 1px 7px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.10); background: transparent;
    }
    .graph-speed-label { font-size: 10px; font-family: system-ui, sans-serif; color: rgba(255,255,255,0.45); }
    .graph-speed-input { width: 70px; height: 2px; accent-color: #a78bfa; cursor: pointer; }
    .graph-speed-val {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px; color: rgba(255,255,255,0.5);
      min-width: 14px; text-align: right;
    }
    .graph-search-row { display: flex; gap: 6px; align-items: center; }
    .graph-search-input {
      flex: 1; min-width: 120px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.14);
      color: rgba(255,255,255,0.9);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 11px;
      outline: none;
    }
    .graph-search-input:focus { border-color: rgba(124,106,247,0.8); }
    .btn-graph-search {
      font-size: 10px; font-family: system-ui, sans-serif;
      padding: 4px 8px; border-radius: 8px;
      border: 1px solid rgba(124,106,247,0.5);
      background: rgba(124,106,247,0.12); color: rgba(220,215,255,0.95);
      cursor: pointer; transition: all 0.15s;
    }
    .btn-graph-search:hover { filter: brightness(1.1); transform: scale(1.04); }
    .btn-graph-search-nav {
      font-size: 10px; font-family: system-ui, sans-serif;
      padding: 4px 7px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06); color: rgba(220,215,255,0.9);
      cursor: pointer; transition: all 0.15s; line-height: 1;
    }
    .btn-graph-search-nav:hover { filter: brightness(1.15); border-color: rgba(124,106,247,0.6); }
    .graph-search-count {
      font-size: 10px; font-family: system-ui, sans-serif;
      color: rgba(220,215,255,0.7);
      min-width: 32px; text-align: center; visibility: hidden;
    }
    .graph-chips-row { display: flex; flex-wrap: wrap; gap: 4px; }
    .graph-chip {
      font-size: 10px; font-family: system-ui, sans-serif;
      padding: 2px 7px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: transparent; color: rgba(255,255,255,0.3); cursor: pointer; transition: all 0.15s; transform-origin: center;
    }
    .graph-chip:hover { opacity: 0.9; transform: scale(1.09); }
    .graph-chip.active {
      border-color: var(--chip-color); color: var(--chip-color);
      background: color-mix(in srgb, var(--chip-color) 12%, transparent);
      box-shadow: 0 0 6px color-mix(in srgb, var(--chip-color) 30%, transparent);
    }
    .graph-forces-panel { display: none; flex-direction: column; gap: 6px; padding: 4px 0 2px; }
    .graph-forces-panel.visible { display: flex; }
    .graph-force-row { display: flex; align-items: center; gap: 8px; }
    .graph-force-row label { font-size: 10px; font-family: system-ui, sans-serif; color: rgba(255,255,255,0.35); width: 80px; flex-shrink: 0; }
    .graph-force-row input[type=range] { flex: 1; accent-color: #a78bfa; height: 2px; cursor: pointer; }
    .graph-force-row span { font-size: 10px; font-family: monospace; color: rgba(255,255,255,0.3); width: 36px; text-align: right; }
    #graph-canvas { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; }
    #loading {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      color: rgba(255,255,255,0.3); font-family: system-ui, sans-serif; font-size: 13px;
    }
    /* Context menu */
    #graph-context-menu {
      position: fixed; background: #14141c; border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px; padding: 4px; z-index: 9999; min-width: 160px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    #graph-context-menu.hidden { display: none; }
    .ctx-menu-item {
      padding: 7px 12px; border-radius: 5px; cursor: pointer; font-size: 12px;
      color: rgba(255,255,255,0.9); display: flex; align-items: center; gap: 8px;
      font-family: system-ui, sans-serif;
    }
    .ctx-menu-item:hover { background: rgba(255,255,255,0.08); }
    /* File modal */
    #graph-file-modal {
      position: fixed; inset: 0; z-index: 9998;
      display: flex; align-items: center; justify-content: center;
    }
    #graph-file-modal.hidden { display: none; }
    #graph-file-modal .modal-backdrop {
      position: absolute; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
    }
    .graph-file-modal-panel {
      position: relative; z-index: 1;
      width: min(820px, 92vw); height: min(70vh, 640px);
      background: #14141c; border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; display: flex; flex-direction: column;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
    }
    #graph-file-modal .modal-header {
      padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; gap: 12px;
    }
    #graph-file-modal .modal-title {
      font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.95);
      font-family: system-ui, sans-serif;
    }
    #graph-file-modal .modal-sub {
      font-family: Menlo, monospace; font-size: 11px; color: rgba(255,255,255,0.5);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
    }
    #graph-file-modal .modal-close {
      background: none; border: none; color: rgba(255,255,255,0.55);
      font-size: 20px; cursor: pointer; padding: 0 8px; border-radius: 6px; line-height: 1;
    }
    #graph-file-modal .modal-close:hover { background: #ef4444; color: white; }
    .graph-file-modal-body { flex: 1; display: flex; min-height: 0; padding: 10px; }
    #graph-file-modal-textarea {
      flex: 1; resize: none;
      background: #0c0c12; color: rgba(255,255,255,0.92);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px; line-height: 1.45; white-space: pre; overflow: auto; tab-size: 2;
    }
    #graph-file-modal-notice {
      flex: 1; display: flex; align-items: center; justify-content: center;
      font-size: 13px; color: rgba(255,255,255,0.7);
      border: 1px dashed rgba(255,255,255,0.12); border-radius: 6px;
      font-family: system-ui, sans-serif;
    }
    #graph-file-modal-notice.hidden { display: none; }
    .graph-file-modal-actions {
      display: flex; align-items: center; justify-content: flex-end;
      gap: 8px; padding: 8px 10px 10px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .graph-file-modal-actions #graph-file-modal-status {
      margin-right: auto; font-size: 11px; color: rgba(255,255,255,0.55);
      font-family: system-ui, sans-serif;
    }
    .graph-file-modal-actions button {
      font-size: 12px; padding: 6px 12px; border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.85);
      cursor: pointer; font-family: system-ui, sans-serif;
    }
    .graph-file-modal-actions button:hover:not(:disabled) { background: rgba(255,255,255,0.1); }
    .graph-file-modal-actions button:disabled { opacity: 0.5; cursor: not-allowed; }
    .graph-file-modal-actions button.primary {
      border-color: rgba(124,106,247,0.6);
      background: rgba(124,106,247,0.18);
      color: rgba(220,215,255,0.98);
    }
    .graph-file-modal-actions button.primary:hover:not(:disabled) { filter: brightness(1.1); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="titlebar">
    <span class="app-title">
      <svg class="app-title-bolt" viewBox="0 0 24 24" aria-hidden="true"><polygon points="13,2 3,14 12,14 11,22 21,10 12,10"/></svg>
      POWER-AGENT — GRAFO
    </span>
    <span id="cwd-label"></span>
  </div>
  <div id="controls">
    <div class="graph-mode-row" id="mode-row"></div>
    <div class="graph-search-row" id="search-row"></div>
    <div class="graph-chips-row" id="chips-row"></div>
    <div class="graph-forces-panel" id="forces-row"></div>
  </div>
  <div id="loading">Cargando grafo…</div>
  <svg id="graph-canvas"></svg>

  <div id="graph-context-menu" class="hidden"></div>

  <div id="graph-file-modal" class="hidden">
    <div class="modal-backdrop"></div>
    <div class="graph-file-modal-panel">
      <div class="modal-header">
        <span class="modal-title" id="graph-file-modal-title">Archivo</span>
        <span class="modal-sub" id="graph-file-modal-sub"></span>
        <button id="graph-file-modal-close" class="modal-close">×</button>
      </div>
      <div class="graph-file-modal-body">
        <textarea id="graph-file-modal-textarea" spellcheck="false"></textarea>
        <div id="graph-file-modal-notice" class="hidden"></div>
      </div>
      <div class="graph-file-modal-actions">
        <span id="graph-file-modal-status"></span>
        <button id="graph-file-modal-cancel">Cerrar</button>
        <button id="graph-file-modal-save" class="primary">Guardar</button>
      </div>
    </div>
  </div>

  <script src="node_modules/d3/dist/d3.min.js"></script>
  <script src="graph-renderer.js"></script>
  <script src="graph-window-renderer.js"></script>
</body>
</html>
