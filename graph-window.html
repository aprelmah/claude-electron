<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' blob: data:">
  <title>POWER-AGENT — Grafo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #050508; overflow: hidden; }
    #titlebar {
      position: fixed; top: 0; left: 0; right: 0; height: 32px;
      background: rgba(5,5,8,0.85); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px; z-index: 10; -webkit-app-region: drag;
    }
    #titlebar span { font-size: 11px; color: rgba(255,255,255,0.4); font-family: system-ui, sans-serif; }
    #btn-close-graph {
      -webkit-app-region: no-drag; background: none; border: none;
      color: rgba(255,255,255,0.4); cursor: pointer; font-size: 16px; line-height: 1;
      padding: 4px 6px; border-radius: 4px;
    }
    #btn-close-graph:hover { color: #fff; background: rgba(255,255,255,0.1); }
    #controls {
      position: fixed; top: 32px; left: 0; right: 0;
      background: rgba(5,5,8,0.8); backdrop-filter: blur(8px);
      display: flex; flex-direction: column; gap: 4px;
      padding: 6px 12px; z-index: 9;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .graph-mode-row { display: flex; gap: 4px; }
    .graph-mode-btn {
      font-size: 10px; font-family: system-ui, sans-serif;
      padding: 2px 9px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: transparent; color: rgba(255,255,255,0.3); cursor: pointer; transition: all 0.15s;
    }
    .graph-mode-btn.active {
      border-color: rgba(148,163,184,0.7); color: rgba(148,163,184,1);
      background: rgba(148,163,184,0.1);
    }
    .graph-mode-btn:hover { opacity: 0.85; }
    .graph-chips-row { display: flex; flex-wrap: wrap; gap: 4px; }
    .graph-chip {
      font-size: 10px; font-family: system-ui, sans-serif;
      padding: 2px 7px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: transparent; color: rgba(255,255,255,0.3); cursor: pointer; transition: all 0.15s;
    }
    .graph-chip.active {
      border-color: var(--chip-color); color: var(--chip-color);
      background: color-mix(in srgb, var(--chip-color) 12%, transparent);
      box-shadow: 0 0 6px color-mix(in srgb, var(--chip-color) 30%, transparent);
    }
    .graph-chip:hover { opacity: 0.85; }
    #graph-canvas {
      position: fixed; left: 0; right: 0; bottom: 0;
      width: 100%;
    }
    #loading {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      color: rgba(255,255,255,0.3); font-family: system-ui, sans-serif; font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="titlebar">
    <span>⟁ POWER-AGENT — Grafo</span>
    <button id="btn-close-graph">×</button>
  </div>
  <div id="controls">
    <div class="graph-mode-row" id="mode-row"></div>
    <div class="graph-chips-row" id="chips-row"></div>
  </div>
  <div id="loading">Cargando grafo…</div>
  <svg id="graph-canvas"></svg>

  <script src="node_modules/d3/dist/d3.min.js"></script>
  <script src="graph-renderer.js"></script>
  <script src="graph-window-renderer.js"></script>
</body>
</html>
