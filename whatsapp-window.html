<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' blob: data: wa-media:; media-src 'self' blob: wa-media:; connect-src 'self'">
  <title>POWER-AGENT — WhatsApp</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
    body { font-family: var(--font); color: var(--text); }
    /* Hueco para los semáforos macOS en el header del panel (solo standalone) */
    body.wa-standalone-host .wa-header { padding-left: 82px !important; }
    body.wa-standalone-host .wa-header { -webkit-app-region: drag; }
    body.wa-standalone-host .wa-header button,
    body.wa-standalone-host .wa-header input,
    body.wa-standalone-host .wa-header select { -webkit-app-region: no-drag; }
  </style>
</head>
<body class="dark wa-standalone-host" data-wa-standalone="1">
  <script src="whatsapp/whatsapp-panel.js"></script>
</body>
</html>
