<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src 'self' blob:; img-src 'self' blob: data:">
  <title>POWER-AGENT</title>
  <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="dark">
  <div id="titlebar">
    <div id="drag-area"><span id="app-title"><svg class="app-title-bolt" viewBox="0 0 24 24" aria-hidden="true"><polygon points="13,2 3,14 12,14 11,22 21,10 12,10"/></svg>POWER-AGENT</span></div>

    <div id="controls">
      <select id="cli-selector" title="Seleccionar Claude o Codex" aria-label="CLI activo">
        <option value="claude">Claude</option>
        <option value="codex">Codex</option>
      </select>
      <button id="health-indicator" class="health-indicator" title="Estado del sistema" aria-label="Estado del sistema" aria-haspopup="dialog" aria-expanded="false">
        <span id="health-global-dot" class="health-global-dot state-off"></span>
        <span class="health-dots" aria-hidden="true">
          <span id="health-dot-pty" class="health-dot state-off"></span>
          <span id="health-dot-telegram" class="health-dot state-off"></span>
          <span id="health-dot-whatsapp" class="health-dot state-off"></span>
          <span id="health-dot-launchd" class="health-dot state-off"></span>
          <span id="health-dot-scheduler" class="health-dot state-off"></span>
        </span>
      </button>
      <button id="btn-new-window" class="icon-btn" title="Nueva ventana (Cmd+N)" aria-label="Nueva ventana">
        <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button id="btn-sessions" class="icon-btn" title="Sesiones de esta carpeta" aria-label="Sesiones de esta carpeta">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
      </button>
      <button id="btn-sidebar" class="icon-btn active" title="Mostrar/ocultar explorador" aria-label="Mostrar u ocultar explorador" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="5" y1="7" x2="7" y2="7"/><line x1="5" y1="11" x2="7" y2="11"/><line x1="5" y1="15" x2="7" y2="15"/></svg>
      </button>
      <button id="btn-layout-left" class="icon-btn layout-btn active" title="Sidebar izquierda" aria-label="Layout sidebar izquierda" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="2"/><line x1="8" y1="2" x2="8" y2="22"/></svg>
      </button>
      <button id="btn-layout-right" class="icon-btn layout-btn" title="Sidebar derecha" aria-label="Layout sidebar derecha" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="2"/><line x1="16" y1="2" x2="16" y2="22"/></svg>
      </button>
      <button id="btn-layout-horizontal" class="icon-btn layout-btn" title="Sidebar arriba" aria-label="Layout sidebar arriba" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="2"/><line x1="2" y1="9" x2="22" y2="9"/></svg>
      </button>
      <button id="btn-layout-split" class="icon-btn layout-btn" title="50/50 vertical" aria-label="Layout 50/50 vertical" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="2"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
      </button>
      <button id="btn-pin" class="icon-btn" title="Fijar siempre encima" aria-label="Fijar ventana siempre encima" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14l-2-6V5H7v6l-2 6z"/></svg>
      </button>
      <button id="btn-theme" class="icon-btn" title="Cambiar tema" aria-label="Cambiar tema claro u oscuro">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v18" fill="currentColor"/><path d="M12 3a9 9 0 0 0 0 18V3z" fill="currentColor" stroke="none"/></svg>
      </button>
      <button id="btn-tasks" class="icon-btn" title="Tareas programadas (Cmd+Shift+T)" aria-label="Tareas programadas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9,11 12,14 22,4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      </button>
      <button id="btn-open-graph-window" class="icon-btn" title="Abrir grafo en ventana independiente" aria-label="Abrir grafo de sesiones en ventana independiente">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/><line x1="6" y1="6" x2="12" y2="12"/><line x1="18" y1="6" x2="12" y2="12"/><line x1="6" y1="18" x2="12" y2="12"/><line x1="18" y1="18" x2="12" y2="12"/></svg>
      </button>
      <button id="btn-bitacora" class="icon-btn text-btn titlebar-text-btn" title="Abrir bitácora semántica" aria-label="Abrir bitácora semántica">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
        <span>Bitácora</span>
      </button>
      <button id="btn-settings" class="icon-btn" title="Configuracion" aria-label="Abrir configuración">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 .6 1.65 1.65 0 0 0-.33 1V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 20a1.65 1.65 0 0 0-1-.6 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-.6-1 1.65 1.65 0 0 0-1-.33H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4 9a1.65 1.65 0 0 0 .6-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06A2 2 0 1 1 7.04 3.3l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-.6 1.65 1.65 0 0 0 .33-1V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4a1.65 1.65 0 0 0 1 .6 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.2.3.5.5.84.58.34.08.69.1 1.03.09a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1 .33c-.3.2-.5.5-.58.84z"/></svg>
      </button>
      <span id="btn-send-telegram-wrap" style="display:inline-flex">
        <button id="btn-send-telegram" class="icon-btn" disabled aria-label="Enviar a Telegram">
          <svg class="tg-logo" viewBox="0 0 16 16" aria-hidden="true">
            <circle class="tg-bg" cx="8" cy="8" r="8"></circle>
            <path class="tg-plane" d="M8.287 5.906c-.778.324-2.334.994-4.666 2.01-.378.15-.577.298-.595.442-.03.243.275.339.69.47l.175.055c.408.133.958.288 1.243.294.26.006.549-.1.868-.32 2.179-1.471 3.304-2.214 3.374-2.23.05-.012.12-.026.166.016.047.041.042.12.037.141-.03.129-1.227 1.241-1.846 1.817-.193.18-.33.307-.358.336a8.154 8.154 0 0 1-.188.186c-.38.366-.664.64.015 1.088.327.216.589.393.85.571.284.194.568.387.936.629.093.06.183.125.27.187.331.236.63.448.997.414.214-.02.435-.22.547-.82.265-1.417.786-4.486.906-5.751a1.426 1.426 0 0 0-.013-.315.337.337 0 0 0-.114-.217.526.526 0 0 0-.31-.093c-.3.005-.763.166-2.984 1.09z"></path>
          </svg>
        </button>
      </span>
      <button id="btn-restart" class="icon-btn" title="Reiniciar sesión Claude" aria-label="Reiniciar sesión Claude">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="23,4 23,10 17,10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      </button>
      <button id="btn-minimize" class="icon-btn" title="Minimizar" aria-label="Minimizar ventana">
        <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button id="btn-close" class="icon-btn" title="Cerrar" aria-label="Cerrar ventana">
        <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
    </div>
  </div>
  <div id="health-popover" class="hidden" role="dialog" aria-label="Detalle de salud del sistema">
    <div class="health-popover-title">Salud del sistema</div>
    <div id="health-popover-list" class="health-popover-list"></div>
    <div id="health-popover-meta" class="health-popover-meta">Sin datos</div>
  </div>

  <div id="session-strip">
    <span id="session-strip-cli" class="session-strip-cli">Claude</span>
    <span id="session-strip-title">Sesión: detectando…</span>
    <button id="session-strip-id" class="session-strip-id" title="Copiar UID exacta de sesión" disabled>UID: —</button>
  </div>

  <div id="main">
    <aside id="sidebar">
      <div id="sidebar-header">
        <button id="btn-nav-back" class="icon-btn small" title="Carpeta anterior" aria-label="Carpeta anterior" disabled>
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><polyline points="15,18 9,12 15,6"/></svg>
        </button>
        <button id="btn-nav-forward" class="icon-btn small" title="Carpeta siguiente" aria-label="Carpeta siguiente" disabled>
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><polyline points="9,18 15,12 9,6"/></svg>
        </button>
        <span id="sidebar-title" title="">Explorador</span>
        <div class="side-actions">
          <button id="btn-view-tree" class="icon-btn small active" title="Vista árbol" aria-label="Vista árbol" aria-pressed="true">
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </button>
          <button id="btn-view-graph" class="icon-btn small" title="Vista grafo" aria-label="Vista grafo" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="3" cy="6" r="2"/><circle cx="21" cy="6" r="2"/><circle cx="3" cy="18" r="2"/><circle cx="21" cy="18" r="2"/><line x1="5" y1="7" x2="10" y2="10"/><line x1="19" y1="7" x2="14" y2="10"/><line x1="5" y1="17" x2="10" y2="14"/><line x1="19" y1="17" x2="14" y2="14"/></svg>
          </button>
          <button id="btn-work-here" class="icon-btn small" title="Reiniciar Claude en esta carpeta" aria-label="Reiniciar Claude en esta carpeta">
            <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="5,3 19,12 5,21" fill="currentColor"/></svg>
          </button>
          <button id="btn-open-folder" class="icon-btn small" title="Abrir otra carpeta" aria-label="Abrir otra carpeta">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          </button>
          <button id="btn-refresh-tree" class="icon-btn small" title="Recargar árbol" aria-label="Recargar árbol de archivos">
            <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="23,4 23,10 17,10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          </button>
        </div>
      </div>
      <div id="graph-filters" class="hidden"></div>
      <div id="tree"></div>
      <svg id="graph-canvas" class="hidden"></svg>
      <div id="cwd-bar">
        <span class="cwd-label">claude cwd:</span>
        <span id="cwd-value">—</span>
      </div>
    </aside>

    <div id="divider"></div>

    <div id="terminal-wrap">
    <div id="terminal-toolbar">
      <button id="btn-mic" class="action icon-btn small" title="Dictado por voz (Cmd+Shift+M)" aria-label="Dictado por voz" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 1 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
      </button>
      <button id="btn-image" class="action icon-btn small" title="Adjuntar imagen" aria-label="Adjuntar imagen">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21,15 16,10 5,21"/></svg>
      </button>
      <button id="btn-file" class="action icon-btn small" title="Adjuntar archivo" aria-label="Adjuntar archivo">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
    </div>
    <div id="terminal"></div>
    <div id="drop-overlay" class="hidden">
      <div class="drop-msg">Suelta para adjuntar</div>
    </div>
    <div id="status-bar" class="hidden" role="status" aria-live="polite">
      <span id="status-text"></span>
    </div>
  </div>
  </div>

  <div id="sessions-modal" class="hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-panel">
      <div class="modal-header">
        <span class="modal-title">Sesiones</span>
        <span id="sessions-cwd" class="modal-sub"></span>
        <button id="btn-close-sessions" class="modal-close" aria-label="Cerrar sesiones">×</button>
      </div>
      <div id="sessions-list"></div>
      <div id="sessions-empty" class="hidden">Sin sesiones para esta carpeta.</div>
    </div>
  </div>

  <div id="settings-modal" class="hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-panel settings">
      <div class="modal-header">
        <span class="modal-title">Configuracion</span>
        <span class="modal-sub">CLI local + Telegram bridge movil</span>
        <button id="btn-close-settings" class="modal-close" aria-label="Cerrar configuración">×</button>
      </div>
      <div class="settings-body">
        <div class="settings-group">
          <div class="settings-group-title">CLI</div>
          <label class="settings-field">
            <span>CLI por defecto</span>
            <select id="cfg-default-cli">
              <option value="claude">Claude</option>
              <option value="codex">Codex</option>
            </select>
          </label>
          <label class="settings-field">
            <span>CLAUDE_BIN</span>
            <input id="cfg-claude-bin" type="text" placeholder="/ruta/a/claude o comando" />
          </label>
          <label class="settings-field">
            <span>CODEX_BIN</span>
            <input id="cfg-codex-bin" type="text" placeholder="/ruta/a/codex o comando" />
          </label>
          <label class="settings-field">
            <span>WHISPER_BIN</span>
            <input id="cfg-whisper-bin" type="text" placeholder="/ruta/a/whisper o comando" />
          </label>
        </div>

        <div class="settings-group">
          <div class="settings-group-title">Telegram</div>
          <label class="settings-check">
            <input id="cfg-telegram-enabled" type="checkbox" />
            <span>Activar puente Telegram</span>
          </label>
          <label class="settings-field">
            <span>Bot token</span>
            <input id="cfg-telegram-token" type="password" placeholder="123456:AA..." />
          </label>
          <label class="settings-field">
            <span>Allowed users (IDs Telegram, separados por coma)</span>
            <input id="cfg-telegram-users" type="text" placeholder="12345678, 98765432" />
          </label>
          <div class="settings-row">
            <label class="settings-field">
              <span>Modelo Claude (Telegram)</span>
              <select id="cfg-telegram-claude-model">
                <option value="">Default</option>
                <option value="haiku">Haiku (barato)</option>
                <option value="sonnet">Sonnet</option>
                <option value="opus">Opus (caro)</option>
              </select>
            </label>
            <label class="settings-field">
              <span>Esfuerzo Claude</span>
              <select id="cfg-telegram-claude-effort">
                <option value="">Default</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
                <option value="xhigh">Xhigh</option>
                <option value="max">Max</option>
              </select>
            </label>
          </div>
          <div class="settings-row">
            <label class="settings-field">
              <span>Modelo Codex (Telegram)</span>
              <select id="cfg-telegram-codex-model">
                <option value="">Default (gpt-5.4-mini)</option>
                <option value="gpt-5.4-mini">gpt-5.4-mini (barato)</option>
                <option value="gpt-5.4">gpt-5.4</option>
                <option value="o3-mini">o3-mini (reasoning)</option>
                <option value="o3">o3 (reasoning caro)</option>
              </select>
            </label>
            <label class="settings-field">
              <span>Esfuerzo Codex</span>
              <select id="cfg-telegram-codex-effort">
                <option value="">Default</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
              </select>
            </label>
          </div>
          <div id="cfg-telegram-status" class="settings-note">Estado: -</div>
        </div>
      </div>
      <div class="settings-actions">
        <button id="btn-refresh-telegram-status" class="icon-btn text-btn">Refrescar estado</button>
        <button id="btn-save-settings" class="icon-btn text-btn primary">Guardar configuracion</button>
      </div>
    </div>
  </div>

  <div id="graph-context-menu" class="hidden"></div>

  <div id="graph-file-modal" class="hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-panel graph-file-modal-panel">
      <div class="modal-header">
        <span class="modal-title" id="graph-file-modal-title">Archivo</span>
        <span class="modal-sub" id="graph-file-modal-sub"></span>
        <button id="graph-file-modal-close" class="modal-close" aria-label="Cerrar modal de archivo">×</button>
      </div>
      <div class="graph-file-modal-body">
        <textarea id="graph-file-modal-textarea" spellcheck="false"></textarea>
        <div id="graph-file-modal-notice" class="hidden"></div>
      </div>
      <div class="graph-file-modal-actions">
        <span id="graph-file-modal-status" class="settings-note"></span>
        <button id="graph-file-modal-cancel" class="icon-btn text-btn">Cerrar</button>
        <button id="graph-file-modal-save" class="icon-btn text-btn primary">Guardar</button>
      </div>
    </div>
  </div>

  <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="renderer.js"></script>
  <script src="node_modules/d3/dist/d3.min.js"></script>
  <script src="graph-renderer.js"></script>
  <script src="whatsapp/whatsapp-panel.js"></script>
</body>
</html>
